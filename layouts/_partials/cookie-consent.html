<div class="cookie-consent" id="cookie-consent" hidden>
  <div class="cookie-consent__inner">
    <p>
      Usamos cookies para analisar o tráfego e melhorar sua experiência. Ao
      aceitar, você permite o uso de cookies de análise e publicidade.
    </p>
    <div class="cookie-consent__actions">
      <button
        type="button"
        class="btn btn--ghost btn--small"
        id="cookie-decline"
      >
        Recusar
      </button>
      <button
        type="button"
        class="btn btn--primary btn--small"
        id="cookie-accept"
      >
        Aceitar
      </button>
    </div>
  </div>
</div>
